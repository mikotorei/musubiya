<!doctype html><html><head><meta charset="utf-8">
<!-- OFUSE 用の画像（icon.png と header.png）のもと。#icon（1000×1000）と #header（1500×500）をそれぞれ画像として書き出す。
     2026-11-25 にサイトの今の見た目（水引の色：白磁・文字の紺・縹・紅、見出し Zen Old Mincho）とひと言「人の声を、形にする。」に合わせて作り直した。
     書体は @fontsource（npm）の Zen Old Mincho 700 と Zen Kaku Gothic New 500 を読み込んで書き出した。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500&family=Zen+Old+Mincho:wght@700&display=swap">
<style>
html,body{margin:0}
.icon{width:1000px;height:1000px;display:grid;place-items:center;background:#F6F8FA}
.icon .seal{width:640px;height:640px;border:26px solid #C8102E;box-sizing:border-box;display:grid;place-items:center}
.icon .seal span{font-family:"Zen Old Mincho";font-weight:700;font-size:430px;line-height:1;color:#C8102E;transform:translateY(-14px)}
.header{width:1500px;height:500px;background:#F6F8FA;color:#1B2E45;display:flex;align-items:center;justify-content:center;gap:60px;position:relative;font-family:"Zen Kaku Gothic New"}
.header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20px;background:#2A73A8}
.header .seal{width:190px;height:190px;border:9px solid #C8102E;box-sizing:border-box;display:grid;place-items:center}
.header .seal span{font-family:"Zen Old Mincho";font-weight:700;font-size:128px;line-height:1;color:#C8102E;transform:translateY(-5px)}
.header .name{font-family:"Zen Old Mincho";font-weight:700;font-size:92px;letter-spacing:.14em;line-height:1.2}
.header .lead{margin-top:12px;font-family:"Zen Old Mincho";font-weight:700;font-size:40px;letter-spacing:.08em;color:#2A73A8}
.header .maker{margin-top:12px;font-size:26px;letter-spacing:.2em;color:rgba(27,46,69,.7)}
</style></head><body>
<div class="icon" id="icon"><div class="seal"><span>結</span></div></div>
<div class="header" id="header"><div class="seal"><span>結</span></div><div><div class="name">結び屋</div><div class="lead">人の声を、形にする。</div><div class="maker">作り手 みこ</div></div></div>
</body></html>
